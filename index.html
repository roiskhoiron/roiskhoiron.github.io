    <script>
      // Resolve the theme before first paint so there is no dark→light flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme-preference'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var h = document.documentElement;
        h.classList.toggle('dark', t === 'dark');
        h.classList.toggle('light', t === 'light');
        h.style.colorScheme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fcfcfc');
      })();
    </script>
